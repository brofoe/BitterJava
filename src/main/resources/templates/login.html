<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<main th:replace="~{layout :: layout(~{::section})}">
    <section class="auth-card">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Log in</h1>
        <p class="form-message success-message" th:if="${registered}">Your account is ready. Please log in.</p>
        <p class="form-message success-message" th:if="${loggedOut}">You have been logged out.</p>
        <p class="form-message error-message" th:if="${error}" th:text="${error}"></p>

        <form class="auth-form" th:action="@{/login}" method="post">
            <input type="hidden" name="_csrf" th:value="${csrfToken}">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" maxlength="30"
                   autocomplete="username" required th:value="${username}">

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button class="primary-button" type="submit">Log in</button>
        </form>
        <p class="form-footer">New here? <a th:href="@{/register}">Create an account</a></p>
    </section>
</main>
</body>
</html>
