<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<main th:replace="~{layout :: layout(~{::section})}">
    <section class="auth-card">
        <p class="eyebrow">JOIN THE COMMUNITY</p>
        <h1>Create an account</h1>
        <p class="form-message error-message" th:if="${error}" th:text="${error}"></p>

        <form class="auth-form" th:action="@{/register}" method="post">
            <input type="hidden" name="_csrf" th:value="${csrfToken}">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" minlength="3" maxlength="30"
                   pattern="[A-Za-z0-9_]{3,30}" autocomplete="username" required
                   th:value="${username}">

            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="8"
                   autocomplete="new-password" required>
            <p class="field-hint">Use at least 8 characters. Passwords are stored as BCrypt hashes.</p>

            <button class="primary-button" type="submit">Create account</button>
        </form>
        <p class="form-footer">Already registered? <a th:href="@{/login}">Log in</a></p>
    </section>
</main>
</body>
</html>
